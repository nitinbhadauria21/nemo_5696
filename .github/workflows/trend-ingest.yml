name: Trend ingest (30m)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger trend ingest
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE="${APP_URL:-https://nemo-5696.vercel.app}"
          BASE="${BASE%/}"
          echo "Ingest POST ${BASE}/api/trends/ingest"
          HTTP_CODE=$(curl -sS -o /tmp/ingest.json -w "%{http_code}" \
            -X POST "${BASE}/api/trends/ingest" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 120)
          echo "HTTP ${HTTP_CODE}"
          cat /tmp/ingest.json || true
          test "${HTTP_CODE}" = "200" -o "${HTTP_CODE}" = "201"
